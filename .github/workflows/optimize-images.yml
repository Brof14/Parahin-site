name: Optimize existing JPEG assets

on:
  push:
    branches:
      - improve/site-quality-2026-10-31
    paths:
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - name: Encode original photos to WebP
        run: |
          mkdir -p assets/images
          cwebp -quiet -q 82 -resize 240 0 photo_2026-06-28_20-30-13.jpg -o assets/images/avatar.webp
          cwebp -quiet -q 80 altai-bg.jpg -o assets/images/altai-bg.webp
          test -s assets/images/avatar.webp
          test -s assets/images/altai-bg.webp
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/avatar.webp assets/images/altai-bg.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: add optimized WebP images [skip ci]'
          git push origin HEAD:improve/site-quality-2026-10-31
